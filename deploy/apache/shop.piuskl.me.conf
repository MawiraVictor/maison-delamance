# Apache2 virtual host for shop.piuskl.me (Maison Delamance)

# Port 80: send every plain-HTTP request to HTTPS
<VirtualHost *:80>
    ServerName shop.piuskl.me
    ServerAdmin webmaster@piuskl.me

    Redirect permanent / https://shop.piuskl.me/

    ErrorLog  ${APACHE_LOG_DIR}/shop.piuskl.me-error.log
    CustomLog ${APACHE_LOG_DIR}/shop.piuskl.me-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<IfModule mod_socache_shmcb.c>
    SSLStaplingCache "shmcb:${APACHE_RUN_DIR}/ssl_stapling(128000)"
</IfModule>

# Port 443: the real site, served over TLS
<VirtualHost *:443>
    ServerName shop.piuskl.me
    ServerAdmin webmaster@piuskl.me

    DocumentRoot /var/www/shop
    DirectoryIndex index.php

    # ---- TLS -------------------------------------------------------------
    SSLEngine on

    SSLCertificateFile    /etc/ssl/certs/shop.piuskl.me.crt
    SSLCertificateKeyFile /etc/ssl/private/shop.piuskl.me.key

    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # OCSP stapling: attach the CA's "not revoked" proof to the handshake
    <IfModule mod_socache_shmcb.c>
        SSLUseStapling                   on
        SSLStaplingResponderTimeout      5
        SSLStaplingReturnResponderErrors off
    </IfModule>

    # ---- Security headers -----------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(self)"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # Content Security Policy: only load code from this site.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

    # Don't advertise the PHP version
    Header always unset X-Powered-By
    Header unset X-Powered-By

    # ---- Web root ---------------------------------------------------------
    <Directory /var/www/shop>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The part after index.php is passed to PHP as PATH_INFO.
    AcceptPathInfo On

    # ---- Block internal folders ------------------------------------------
    <DirectoryMatch "^/var/www/shop/(config|includes|modal|control|misc|deploy|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Hidden files (.git, .gitignore, .htaccess) and repo/infra files.
    <FilesMatch "^(\..*|Dockerfile|docker-compose\.ya?ml|README\.md|LICENSE|composer\.(json|lock))$">
        Require all denied
    </FilesMatch>

    # ---- Logs -------------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/shop.piuskl.me-error.log
    CustomLog ${APACHE_LOG_DIR}/shop.piuskl.me-access.log combined
</VirtualHost>
</IfModule>
